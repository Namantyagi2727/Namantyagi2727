<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="hdr-title">
  <title id="hdr-title">Naman Tyagi — notebook cover with a routing diagram sketched on it</title>

  <!-- paper base -->
  <rect x="0" y="0" width="1200" height="300" fill="#F6F5F0"/>

  <!-- ink cover -->
  <rect x="0" y="0" width="944" height="300" fill="#1D334C"/>

  <!-- seam between cover and page edges -->
  <rect x="943" y="0" width="2" height="300" fill="#C4C1B6"/>

  <!-- stacked page edges, right margin -->
  <g stroke="#C4C1B6" stroke-width="2" stroke-linecap="round">
    <line x1="982" y1="56" x2="1146" y2="56"/>
    <line x1="982" y1="101" x2="1128" y2="101"/>
    <line x1="982" y1="146" x2="1152" y2="146"/>
    <line x1="982" y1="191" x2="1122" y2="191"/>
    <line x1="982" y1="236" x2="1140" y2="236"/>
  </g>

  <!-- spine crease + binder holes -->
  <line x1="44" y1="24" x2="44" y2="276" stroke="#4C74A3" stroke-width="1.5" opacity="0.25"/>
  <g fill="#F6F5F0" opacity="0.9">
    <circle cx="22" cy="40" r="4.5"/>
    <circle cx="22" cy="95" r="4.5"/>
    <circle cx="22" cy="150" r="4.5"/>
    <circle cx="22" cy="205" r="4.5"/>
    <circle cx="22" cy="260" r="4.5"/>
  </g>

  <!-- wordmark -->
  <text x="94" y="185" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="70" letter-spacing="-1" fill="#F6F5F0">Naman Tyagi</text>
  <line x1="96" y1="208" x2="250" y2="208" stroke="#A54A42" stroke-width="3" stroke-linecap="round"/>

  <!-- routing motif: one gateway fanning out to two stages, each to two endpoints -->
  <g transform="translate(600,60)" fill="none">
    <g stroke="#4C74A3" stroke-width="2" opacity="0.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20,110 H70 V60 H120"/>
      <path d="M20,110 H70 V160 H120"/>
      <path d="M120,60 H180 V35 H240"/>
      <path d="M120,60 H180 V85 H240"/>
      <path d="M120,160 H180 V135 H240"/>
      <path d="M120,160 H180 V185 H240"/>
    </g>
    <circle cx="20" cy="110" r="9" fill="#A54A42"/>
    <circle cx="120" cy="60" r="6" fill="#1D334C" stroke="#F6F5F0" stroke-width="2"/>
    <circle cx="120" cy="160" r="6" fill="#1D334C" stroke="#F6F5F0" stroke-width="2"/>
    <circle cx="240" cy="35" r="4.5" fill="#4C74A3" opacity="0.9"/>
    <circle cx="240" cy="85" r="4.5" fill="#4C74A3" opacity="0.9"/>
    <circle cx="240" cy="135" r="4.5" fill="#4C74A3" opacity="0.9"/>
    <circle cx="240" cy="185" r="4.5" fill="#4C74A3" opacity="0.9"/>
  </g>
</svg>
